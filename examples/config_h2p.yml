# H2+ cyclotron machine configuration -- component-based schema.
# Migrated from the legacy config_h2p.yml (fully programmatic gmsh-OCC
# geometry, no STP files).

particle_species: "H2_1+"
max_machine_size_mm: 860.0
seed: 42

# ---------------------------------------------------------------------------
# Machine description
# ---------------------------------------------------------------------------
materials:
  iron:
    type: bh_file
    file: "../resources/dillinger_steel.csv"  # relative to this yml

symmetries:
  cyclotron_8fold:
    - [perp, [0, 0, 0], [1, -1, 0]]   # mirror across x=y diagonal
    - [perp, [0, 0, 0], [1, 0, 0]]    # mirror across x=0 plane
    - [perp, [0, 0, 0], [0, 1, 0]]    # mirror across y=0 plane
    - [para, [0, 0, 0], [0, 0, 1]]    # mirror across z=0 plane

components:
  - name: yoke
    kind: wedge
    material: iron
    symmetry: cyclotron_8fold
    mesh: {max_size: 50}
    params:
      inner_radius_mm: 696.5
      outer_radius_mm: 860.0
      height_mm: 188.5
      z_offset_mm: 0.0
      end_ang_deg: 45.0
      include_window: true
      window_width_mm: 300.0

  - name: lid_lower
    kind: wedge
    material: iron
    symmetry: cyclotron_8fold
    mesh: {max_size: 50}
    params:
      inner_radius_mm: 400.0
      outer_radius_mm: 860.0
      height_mm: 96.5
      z_offset_mm: -188.5              # below the yoke wall
      end_ang_deg: 45.0

  - name: lid_upper
    kind: lid_upper
    material: iron
    symmetry: cyclotron_8fold
    mesh: {max_size: 50}
    params:
      inner_radius_mm: 165.0           # should this be 156? was 165
      outer_radius_mm_1: 860.0
      outer_radius_mm_2: 787.0
      height_mm: 80.0
      z_offset_mm: -285.0              # -(yoke 188.5 + lid_lower 96.5)
      end_ang_deg: 45.0
      seg_theta: 8

  - name: pole
    kind: pole
    material: iron
    symmetry: cyclotron_8fold
    shimmed: true                      # shape follows the PoleShape shims
    mesh: {max_size: 25}
    params:
      inner_radius_mm: 50.0
      outer_radius_mm: 400.0
      height_mm: 230.0                 # 235 originally, but top shim is min 5 mm
      half_angle_deg: 10.0             # 20 deg full angle
      pole_zs: -285.0

  - name: extract_channel
    kind: wedge_pair
    enabled: false
    material: iron
    symmetry: null                     # breaks the 8-fold symmetry -> not folded
    mesh: {max_size: 20}
    params:
      inner_radius_mm: 276.0
      outer_radius_mm: 287.0
      height_mm: 20
      channel_width_mm: 12.5
      start_ang_deg: 35
      end_ang_deg: 55
      window_width_mm: 0

  # Full-size +/-z coil pair, NO radia symmetry transforms: symmetrized
  # current sources force a full CPU fallback on the GPU field path
  # (RadiaCUDA issue #16). The symmetry below is only DECLARED metadata for
  # the field-map folding, which is exact for the physically complete pair.
  - name: coils
    kind: racetrack_pair
    symmetry: cyclotron_8fold
    params:                            # names match CoilConfig (live current source)
      radius_min_mm: 460.0
      radius_max_mm: 674.5
      height_mm: 123.5
      midplane_dist: 55
      current_A: -132496               # Amp-turns (initial; optimizer overrides)
      num_segments: 25

# ---------------------------------------------------------------------------
# Shim parametrization (initial/default shape; optimizers pass their own)
# ---------------------------------------------------------------------------
side_shim:
  include: true
  num_rad_segments: 14
  angular_resolution_deg: 1.25
  default_offset_deg: 2.5
  # Best so far:
  side_offsets_deg: [7.094361390352955, 5.16328010607657484, 5.13411228524866747, 5.1,
                     5.11661889606375664, 5.26819056488524773, 5.5015736468832837, 5.7135311751436973,
                     5.7329375098612074, 5.2404676477555279, 5.12272301845211593, 5.8527935541849507,
                     6.7438719489631913, 6.93679885916906, 7.2999158287727846]
  segmentation: [3, 1, 20]

top_shim:
  include: true
  num_rad_segments: 14
  angular_resolution_deg: 1.25
  default_offset_mm: 5.0
  # Best so far:
  top_offsets_mm: [6.7755901194312433, 7.2147690194556935, 7.276484962484513, 7.178882485359684,
                   6.5531573706200315, 6.5216502242193237, 6.327321032033622, 6.4125274596060016,
                   7.1216825896442755, 6.8889741683452925, 6.2200844902718115, 7.052889291692592,
                   8.1714690277632487, 8.8954333622614965, 9.222144117911688]
  segmentation: [3, 1, 1]

# ---------------------------------------------------------------------------
# Workflow sections
# ---------------------------------------------------------------------------
field_evaluation:
  num_points_circle: 360
  radius_min_mm: 75.0
  radius_max_mm: 350.0
  n_eval_pts: 12
  use_symmetry: true
  save_median_plane_field: false
  median_plane_field_output: "output/midplane_field_test_GPU.comsol"
  iso_method: "seo"                    # "circle" | "gordon" | "seo"

simulation:
  precision: 0.0001
  iterations: 3000

optimization:
  target_frequency_mhz: 8.2
  frequency_tolerance_mhz: 0.001
  max_iterations: 100
  coil_current_min_A: 10000
  coil_current_max_A: 200000
  side_shim_min_deg: 5
  side_shim_max_deg: 15
  top_shim_min_mm: 5
  top_shim_max_mm: 20
  num_workers: 1
  n_initial_points: 1
  reference_coil_current: 134000
  regularization_weight: 0.0
  convergence_penalty_weight: 1.0
  random_init: false
  opt_top: false
  opt_side: false
  opt_coil: true
  optimizer: 'nelder-mead'

visualization:
  show_opengl: false
