# Cyclotron machine configuration -- COMPONENT-BASED schema (pilot).
# Equivalent to config_muon_smaller.yml: the geometry is described as a list
# of components with named materials and symmetries instead of fixed sections.

particle_species: "muon"
max_machine_size_mm: 700.0
seed: 42

# ---------------------------------------------------------------------------
# Machine description
# ---------------------------------------------------------------------------
# Materials: type bh_file loads a two-column curve file (H, B|M).
#   curve:  BH (second column is B; default) or MH (second column is M)
#   h_unit: unit of the H column -- "T" (mu0*H in Tesla, the historical
#           radia convention; default), "A/m", "kA/m", "mT", "Oe"
#   b_unit: unit of the B/M column -- "T" (default), "mT", "G", "kG"
# NOTE: the COMSOL 1010 file stores H in A/m -- h_unit is REQUIRED here
# (with the default "T" the iron would be misread as almost non-magnetic).
# dillinger_steel.csv (both columns in T) has a defective tail (mu_r < 1 in
# its last segment -> non-monotone M(H); RadiaMaterial warns when loading).
materials:
  iron:
    type: bh_file
    file: "../resources/COMSOL_1010_BH_T_A-m.csv"  # relative to this yml
    curve: BH
    h_unit: "A/m"
    b_unit: "T"

symmetries:
  cyclotron_8fold:
    - [perp, [0, 0, 0], [1, -1, 0]]   # mirror across x=y diagonal
    - [perp, [0, 0, 0], [1, 0, 0]]    # mirror across x=0 plane
    - [perp, [0, 0, 0], [0, 1, 0]]    # mirror across y=0 plane
    - [para, [0, 0, 0], [0, 0, 1]]    # mirror across z=0 plane
  median_z:                           # median-plane mirror only (extraction channel)
    - [para, [0, 0, 0], [0, 0, 1]]

components:
  - name: yoke
    kind: stp
    file: "../resources/uCyclo_v2_YokeWall.stp"
    material: iron
    symmetry: cyclotron_8fold
    mesh: {max_size: 60}
    mesh_group: iron

  - name: lid_lower
    kind: stp
    file: "../resources/uCyclo_v2_LidLower.stp"
    material: iron
    symmetry: cyclotron_8fold
    mesh: {max_size: 50}
    mesh_group: iron

  - name: lid_upper
    kind: stp
    file: "../resources/uCyclo_v2_LidUpper.stp"
    material: iron
    symmetry: cyclotron_8fold
    mesh: {max_size: 40}
    mesh_group: iron

#  - name: pole
#    kind: stp
#    file: "../resources/uCyclo_v2_ShimmedPole.stp"
#    material: iron
#    symmetry: cyclotron_8fold
#    mesh: {max_size: 30}

  - name: pole
    kind: pole
    material: iron
    symmetry: cyclotron_8fold
    shimmed: true                    # shape follows the PoleShape shims
    mesh: {max_size: 25}
    mesh_group: iron
    params:
      inner_radius_mm: 50.0
      outer_radius_mm: 400.0
      height_mm: 235.0
      half_angle_deg: 15.0           # half-wedge; full pole = 30 deg
      pole_zs: -285.0                # -(yoke 188.5 + lid_lower 96.5)
      cylindrical_faces: true        # exact rim/bore cylinder patches (required
                                     # so fragment can merge them with the lid CAD)

  - name: extract_channel
    kind: wedge
    enabled: false
    material: iron
    symmetry: median_z               # median plane mirror
    perturbative: true               # solved in the frozen machine field (stage 1)
    mesh: {max_size: 20}
    params:
      inner_radius_mm: 276.0
      outer_radius_mm: 287.0
      height_mm: 20
      z_offset_mm: -6.25             # -channel_half_width (12.5/2)
      start_ang_deg: 35
      end_ang_deg: 55

  - name: coils
    kind: racetrack_pair
    symmetry: cyclotron_8fold        # declared field symmetry (pair at +/-z)
    params:                          # names match CoilConfig (live current source)
      radius_min_mm: 460.0
      radius_max_mm: 574.5
      height_mm: 123.5
      midplane_dist: 55
      current_A: 15034.84            # Amp-turns (initial; optimizer overrides)
      num_segments: 25

# ---------------------------------------------------------------------------
# Shim parametrization (initial/default shape; optimizer overrides offsets)
# ---------------------------------------------------------------------------
side_shim:
  include: true
  num_rad_segments: 19
  angular_resolution_deg: 2.5
#  default_offset_deg: 0.0
  side_offsets_deg: [2.60009495,  0.73979659,  0.0, 0.42199612,  1.66590662,  2.99677784,
                     4.85228029,  6.82133653,  8.5499665,   9.78387648, 10.33567868, 10.27294429,
                     9.91347963,  9.43231939,  9.04505908,  8.75995878,  8.58843817,  8.90623647,
                     9.77249649, 10.84986381]
  segmentation: [3, 1, 20]

top_shim:
  include: true
  num_rad_segments: 19
  angular_resolution_deg: 1.25
#  default_offset_mm: 0.0
  top_offsets_mm: [1.73705048, 0.0, 0.0, 1.75125378, 3.04509649, 2.60358329,
                   2.40179285,  1.98828774,  1.49003946,  1.4994747,   1.81490715,  2.49738539,
                   3.4781762,   4.44620898,  5.48165388,  6.40182401,  6.93465152,  7.86533554,
                   9.3088477,  10.89782538]
  segmentation: [3, 1, 1]

# ---------------------------------------------------------------------------
# Workflow sections (unchanged from the legacy schema)
# ---------------------------------------------------------------------------
field_evaluation:
  num_points_circle: 360
  radius_min_mm: 75.0
  radius_max_mm: 350.0
  n_eval_pts: 40
  use_symmetry: true
  iso_method: "gordon"               # "circle" | "gordon" | "seo"
  median_plane_limit_mm: 400
  median_plane_resolution_mm: 0.5

simulation:
  precision: 0.0001
  iterations: 50000
  relax_method: 11        # override the 9-GPU/10-CPU auto choice
  # anderson: true        # Anderson-accelerated relaxation (default off;
  #                       # ~3x fewer iterations on well-conditioned models,
  #                       # can stall above the plain floor on fine tet meshes)
  # perturb_iterations: 0 # perturbative-component back-reaction cycles
  # perturb_tol: 0.0      # early-exit tolerance [T] for those cycles
  # gpu_fallback: break   # what radia does when the interaction matrix does
  #                       # NOT fit in GPU memory. 'cpu' (default) falls back to
  #                       # the CPU, which is correct but can turn a seconds-long
  #                       # solve into an hours-long one; 'break' raises instead,
  #                       # so a model that has outgrown the card is caught at
  #                       # once and the mesh coarsened deliberately;
  #                       # 'gpu_streaming' keeps the matrix in host RAM and
  #                       # streams it a row block at a time -- no VRAM limit on
  #                       # model size, but PCIe traffic on every iteration
  #                       # (bit-identical results). Needs rad.UtiGpuFallback.

optimization:
  target_frequency_mhz: 42
  frequency_tolerance_mhz: 0.001
  max_iterations: 100
  coil_current_min_A: 10000
  coil_current_max_A: 30000
  side_shim_min_deg: 0
  side_shim_max_deg: 15
  top_shim_min_mm: 0
  top_shim_max_mm: 15
  num_workers: 1
  n_initial_points: 1
  reference_coil_current: 13101.9
  regularization_weight: 0.0     # MAGNITUDE penalty (shrinks all offsets to 0)
  convergence_penalty_weight: 1.0
  # Second-difference (roughness) penalty on the shim profile -- removes the
  # jagged mid-radius spike DFO-LS parks in the isochronism null space without
  # penalizing a smooth large shim. 0 = current behavior. Tune with the knee of
  # examples/l_curve_smoothness.py (start ~0.1; the spike is on the SIDE block,
  # so smoothness_weight_side can be raised independently).
  smoothness_weight: 0.1
  # smoothness_weight_side: 0.1  # override for the side block only (falls back
  # smoothness_weight_top: 0.0   # to smoothness_weight when unset)
  precondition: true
  # Start from the config's saved shim offsets (side_offsets_deg / top_offsets_mm)
  # instead of the preconditioner -- set true to resume / warm-start from a
  # known-good design (takes precedence over precondition).
  x0_from_config: true
  # Optimize only the shim stations inside this radial band [mm] (pole radius,
  # 50..400 here over 20 stations ~18.4 mm apart); stations outside stay frozen
  # at their x0 value. Pair with x0_from_config: true to refine a sub-range of a
  # saved design -- e.g. re-smooth just the inner shims (r<150 -> first 6):
  #   opt_shim_radius_max_mm: 150
  # null = no bound on that end (both null optimizes all stations).
  opt_shim_radius_min_mm: null
  opt_shim_radius_max_mm: null
  coil_match_tol_mhz: 0.1
  random_init: false
  opt_top: true
  opt_side: true
  opt_coil: true
  optimizer: 'dfo-ls'
  dfols_rhobeg: 0.1
  dfols_rhoend: 0.03
  dfols_maxfun: null
  dfols_objfun_has_noise: false
  dfols_seek_global_minimum: false

visualization:
  show_opengl: true
  show_median_plane_field: true
  field_map_resolution_mm: 2.0
