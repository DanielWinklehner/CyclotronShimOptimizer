# Cyclotron Geometry Configuration

particle_species: "muon"  # 'muon'
max_machine_size_mm: 700.0
seed: 42

# Symmetry and angles
geometry:
  yoke_build_angle_deg: 45.0
  angular_resolution: 15  # Number of segments to approximate arcs
  use_gmsh_occ_pole: true

# Field evaluation
field_evaluation:
  num_points_circle: 360
  radius_min_mm: 75.0
  radius_max_mm: 350.0
  n_eval_pts: 36  # >= shim params (30)
  use_symmetry: true  # Exploit 8-fold symmetry
  iso_method: "gordon"  # can be "circle" (default), "seo", or "gordon"

# Geometry Parameters
yoke:
  outer_radius_mm: 700.0
  inner_radius_mm: 596.5
  height_mm: 188.5
  max_mesh_size: 50
  segmentation: [2, 1, 3]  # [r, theta, z] divisions
  window_width_mm: 300.0
  stp_filename: "../../resources/uCyclo_v2_YokeWall.stp"

lid_lower:
  outer_radius_mm: 700.0
  inner_radius_mm: 400.0
  height_mm: 96.5
  max_mesh_size: 50
  segmentation: [4, 1, 3]  # [x, y, z] divisions
  stp_filename: "../../resources/uCyclo_v2_LidLower.stp"

lid_upper:
  outer_radius_mm_1: 700.0
  outer_radius_mm_2: 627.0
  inner_radius_mm: 75.0
  height_mm: 80.0
  max_mesh_size: 50
  segmentation: [8, 1, 3]  # [r, theta, z] divisions (cylindrical)
  hole_diameter_mm: 120.0
  hole_center_xy: [198.0, 198.0]
  cut_out_rf_stem_hole: false
  stp_filename: "../../resources/uCyclo_v2_LidUpper.stp"

# --- Pole --- #
# Base
pole:
  outer_radius_mm: 400.0
  inner_radius_mm: 50.0
  max_mesh_size: 50
  height_mm: 235.0
  full_angle_deg: 30.0
  angular_resolution_deg: 2.5  # Angular segment length for arc approximation (deg)
  segmentation: [10, 1, 15]  # Number of [r, theta, z] segments (cylindrical)
#  stp_filename: "D:\\MIT Dropbox\\Daniel Winklehner\\Projects\\Muon Reacceleration\\CAD\\uCyclo_v2\\uCyclo_v2_ShimmedPole.stp"

# Shimming
side_shim:
  include: true
  num_rad_segments: 14  # number of radial segments along the pole edge
  angular_resolution_deg: 2.5  # Angular segment length for arc approximation (deg)
  default_offset_deg: 0.0
#  side_offsets_deg: [5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0]
  side_offsets_deg: [0.508060939923, 0.268477357517, 0.436617667869, 2.584107127607, 3.066780216206, 3.71878354723, 2.380032674047, 0.523226584839, 0.0, 0.432610851746, 0.830951485545, 1.643234287427, 1.66867669368, 2.721763013636, 6.102593035254]
  segmentation: [3, 1, 20]  # Number of [r, theta, z] segments (cylindrical)

top_shim:
  include: true
  num_rad_segments: 14  # number of radial segments along the pole edge (keep same as side for now!)
  angular_resolution_deg: 1.25 # Angular segment length for arc approximation (deg)
  default_offset_mm: 0.0
#  top_offsets_mm: [5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0]
  top_offsets_mm: [0.0, 0.0, 0.873, 1.809, 2.711, 5.969, 6.965, 11.039, 12.79, 13.739, 13.884, 15.0, 15.0, 15.0, 15.0]
  segmentation: [3, 1, 1]  # Number of [r, theta, z] subdivisions (note that arc approximation already segments in theta)
# --- #

extract_channel:
  outer_radius_mm: 287.00
  inner_radius_mm: 276.0
  height_mm: 20
  segmentation: [1, 4, 2]  # [r, theta, z] divisions
  channel_width_mm: 12.5
  # window_width_mm: 1.0
  start_ang_deg: 35
  end_ang_deg: 55
  use_extract_chan: true
  max_mesh_size: 20

coil:
  radius_min_mm: 460.0
  radius_max_mm: 574.5
  height_mm: 123.5
  midplane_dist: 55
  current_A: 15368  # Amp-turns
  num_segments: 25

material:
  saturation_field_t: [20000, 2]
  saturation_curve_m: [0.1, 2]
  linear_curve_m: [0.1, 2]
  bh_filename: "dillinger_steel.csv"

# Simulation
simulation:
  precision: 0.0001
  iterations: 10000

# Optimization
optimization:
  target_frequency_mhz: 42
  frequency_tolerance_mhz: 0.001
  max_iterations: 300
  coil_current_min_A: 10000
  coil_current_max_A: 30000
  side_shim_min_deg: 5
  side_shim_max_deg: 15
  top_shim_min_mm: 5  # TODO: These min values are not really needed anymore now that shim is included in pole
  top_shim_max_mm: 20
  num_workers: 1   # Unused
  n_initial_points: 1  # Initial random sample in Bayesian, or number of multistarts in Nelder-Mead
  reference_coil_current: 15368
  regularization_weight: 0.0  # MAGNITUDE penalty (shrinks all offsets toward 0; NOT roughness)
  convergence_penalty_weight: 1.0  # MHz penalty per unit relaxation-misfit shortfall (continuous convergence gate)
  smoothness_weight: 0.0  # second-difference (roughness) penalty on the shim profile: forbids
                          # jagged spikes without penalizing a smooth large shim (0 = current
                          # behavior; tune via examples/l_curve_smoothness.py, start ~0.1)
  precondition: true  # DFO-LS x0 from the physics preconditioner (top & side both ~ gamma(r): gap & hill-duty-cycle -> B0)
  coil_match_tol_mhz: 0.1  # loose coil/freq match DURING optimization; final match uses frequency_tolerance_mhz
  random_init: false
  opt_top: true
  opt_side: true
  opt_coil: true
  # Optimizer choice
  # nelder-mead, dfo-ls
  optimizer: 'dfo-ls'
  # --- DFO-LS solver knobs (joint least-squares path) ---
  dfols_rhobeg: 0.1            # initial trust-region radius (norm); 0.1 = 1 deg of the 10 deg side range
  dfols_rhoend: 0.03           # final radius (norm); RAISED above the ~0.026-norm mesh-quantization
                               # dead zone (was 1e-3 = 26x below it -> guaranteed early collapse).
                               # Go to ~0.05 if it still stalls; lower again only on a finer mesh.
  dfols_maxfun: null           # null -> max(max_iterations, n_params+2); set ~300 for the robust re-run
  dfols_objfun_has_noise: false      # set TRUE for the gated re-run (enables restarts, gentler termination)
  dfols_seek_global_minimum: false   # hard restarts (global search); expensive -> enable only if restarts
                                     # alone do not escape the local basin

# Visualization
visualization:
  show_opengl: true
  show_median_plane_field: true  # 2D contour plot; with show_opengl also overlaid in the 3D viewer
  field_map_resolution_mm: 2.0   # display-map resolution (viz only; solver maps keep median_plane_resolution_mm)
#  comsol_filename: "D:\\MIT Dropbox\\Daniel Winklehner\\Projects\\Muon Reacceleration\\uCyclo_v2_Midplane_Res0.5mm_400x400mm.txt"
